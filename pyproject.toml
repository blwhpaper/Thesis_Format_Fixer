[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-format-fixer"
version = "0.1.0"
description = "English thesis DOCX format checker/fixer skeleton"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thesis Format Fixer Contributors" }]
dependencies = [
    "PySide6>=6.6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
thesis-format-fixer = "thesis_format_fixer.cli:main"
thesis-format-fixer-api = "thesis_format_fixer.api.app:main"

[project.gui-scripts]
thesis-format-fixer-gui = "thesis_format_fixer.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
